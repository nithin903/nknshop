<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | NKNSHOP</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css?v=20">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width site-header__inner">
        <a class="site-logo" href="index.html">Nkn<span>Shop</span></a>
        <div class="header-actions"><a class="icon-link" href="index.html">Home</a></div>
      </div>
    </header>
    <main class="page-width page-content">
      <span class="section-kicker">Support</span>
      <h1>Contact</h1>
      <p>Orders and questions go to our WhatsApp. Fill this in and we will open a chat with your message.</p>
      <form class="contact-form">
        <input type="text" placeholder="Full name" required>
        <input type="tel" placeholder="Your phone number">
        <textarea rows="6" placeholder="What would you like to book?" required></textarea>
        <button class="btn btn-whatsapp" type="submit">Send on WhatsApp</button>
      </form>
    </main>
    <script src="assets/theme.js?v=14"></script>
  </body>
</html>
